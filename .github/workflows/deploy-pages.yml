name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          PUBLIC_URL: /solana_mobile_vibe_kit
          REACT_APP_PROXY_URL: ${{ vars.REACT_APP_PROXY_URL }}
          REACT_APP_PRIVY_APP_ID: ${{ vars.REACT_APP_PRIVY_APP_ID }}
          REACT_APP_PRIVY_LOGO_URL: ${{ vars.REACT_APP_PRIVY_LOGO_URL }}
          REACT_APP_PRIVY_THEME: ${{ vars.REACT_APP_PRIVY_THEME }}
          REACT_APP_PRIVY_ACCENT_COLOR: ${{ vars.REACT_APP_PRIVY_ACCENT_COLOR }}
          REACT_APP_LAUNCHPAD_WS_URL: ${{ vars.REACT_APP_LAUNCHPAD_WS_URL }}
          REACT_APP_LAUNCHPAD_API_URL: ${{ vars.REACT_APP_LAUNCHPAD_API_URL }}
          REACT_APP_CENTRIFUGE_KEY: ${{ secrets.REACT_APP_CENTRIFUGE_KEY }}
          REACT_APP_LAUNCHPAD_USE_MOCK: ${{ vars.REACT_APP_LAUNCHPAD_USE_MOCK }}
          REACT_APP_WS_RECONNECT_DELAY: ${{ vars.REACT_APP_WS_RECONNECT_DELAY }}
          REACT_APP_WS_MAX_RECONNECT_ATTEMPTS: ${{ vars.REACT_APP_WS_MAX_RECONNECT_ATTEMPTS }}
          REACT_APP_API_TIMEOUT: ${{ vars.REACT_APP_API_TIMEOUT }}
          REACT_APP_API_RETRY_ATTEMPTS: ${{ vars.REACT_APP_API_RETRY_ATTEMPTS }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

