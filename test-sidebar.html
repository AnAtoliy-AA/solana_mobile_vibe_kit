<!DOCTYPE html>
<html>
<head>
  <style>
    .sidebar { 
      width: 280px; 
      background: #f0f0f0; 
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar-toggle-btn {
      display: flex !important;
      width: 44px;
      height: 44px;
      background: blue;
      color: white;
      border: none;
      border-radius: 12px;
      order: -2;
    }
    .sidebar-settings-btn {
      display: flex !important;
      width: 100%;
      height: 52px;
      background: green;
      color: white;
      border: none;
      border-radius: 12px;
      order: 999;
      margin-top: auto;
    }
    .nav-item {
      order: 1;
      padding: 14px;
      background: gray;
      color: white;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <button class="sidebar-toggle-btn">Toggle</button>
    <div class="nav-item">Nav 1</div>
    <div class="nav-item">Nav 2</div>
    <div class="nav-item">Nav 3</div>
    <button class="sidebar-settings-btn">Settings</button>
  </div>
</body>
</html>
